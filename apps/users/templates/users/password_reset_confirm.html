<!-- For beginners: This template (apps/users/templates/users/password_reset_confirm.html) defines what users see in the browser. -->
<!-- For beginners: Dynamic values are inserted by Django views before this HTML is sent. -->

{% extends 'base.html' %}
{% block title %}Set New Password - BimaBora{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-xl shadow-sm p-6">
    <h2 class="text-xl font-bold text-gray-800 text-center mb-1">Set New Password</h2>
    <p class="text-gray-500 text-sm text-center mb-6">Choose a secure password for your account.</p>

    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4 text-sm">{{ error }}</div>
    {% endif %}

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-gray-700 font-semibold mb-1 text-sm">New Password</label>
        <input type="password" name="new_password" required minlength="8"
          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-primary focus:outline-none text-sm">
      </div>
      <div>
        <label class="block text-gray-700 font-semibold mb-1 text-sm">Confirm Password</label>
        <input type="password" name="confirm_password" required minlength="8"
          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-primary focus:outline-none text-sm">
      </div>
      <button type="submit" class="w-full bg-primary text-white py-3 rounded-lg font-semibold text-sm hover:bg-blue-600 transition-colors">
        Update Password
      </button>
    </form>
  </div>
</div>
{% endblock %}
