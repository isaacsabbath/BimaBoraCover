{% extends 'base.html' %}
{% block title %}Reset Password - BimaBora{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-xl shadow-sm p-6">
    <h2 class="text-xl font-bold text-gray-800 text-center mb-1">Reset Password</h2>
    <p class="text-gray-500 text-sm text-center mb-6">Enter your email to receive a reset link.</p>

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-gray-700 font-semibold mb-1 text-sm">Email Address</label>
        <input type="email" name="email" required
          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-primary focus:outline-none text-sm">
      </div>
      <button type="submit" class="w-full bg-primary text-white py-3 rounded-lg font-semibold text-sm hover:bg-blue-600 transition-colors">
        Send Reset Link
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-4"><a href="{% url 'login' %}" class="text-primary font-semibold hover:underline">Back to login</a></p>
  </div>
</div>
{% endblock %}
