{% extends 'base.html' %}
{% block title %}Change Password - BimaBora{% endblock %}
{% block content %}
<div class="container mx-auto px-4 py-5">
  <div class="mb-4">
    <a href="{% url 'profile' %}" class="text-primary text-sm font-semibold">← Back to Profile</a>
  </div>
  <div class="bg-white rounded-xl shadow-sm p-6 max-w-md mx-auto">
    <h2 class="text-xl font-bold text-gray-800 mb-6">Change Password</h2>
    {% if messages %}
    {% for message in messages %}
    <div class="mb-4 px-4 py-3 rounded-lg text-sm {% if message.tags == 'error' %}bg-red-50 border border-red-200 text-red-700{% else %}bg-green-50 border border-green-200 text-green-700{% endif %}">
      {{ message }}
    </div>
    {% endfor %}
    {% endif %}
    <form method="POST" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-gray-700 font-semibold mb-1 text-sm">Current Password</label>
        <input type="password" name="old_password" required placeholder="••••••••"
          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-primary focus:outline-none text-sm">
      </div>
      <div>
        <label class="block text-gray-700 font-semibold mb-1 text-sm">New Password</label>
        <input type="password" name="new_password" required placeholder="••••••••"
          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-primary focus:outline-none text-sm">
      </div>
      <div>
        <label class="block text-gray-700 font-semibold mb-1 text-sm">Confirm New Password</label>
        <input type="password" name="confirm_password" required placeholder="••••••••"
          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-primary focus:outline-none text-sm">
      </div>
      <button type="submit" class="w-full bg-primary text-white py-3 rounded-lg font-semibold text-sm hover:bg-blue-600 transition-colors">
        Update Password
      </button>
    </form>
  </div>
</div>
{% endblock %}
